name: Softify CI (Rust Core & Compose Multiplatform)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rust-check-and-test:
    name: Rust Core Compilation & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Check compilation
        run: |
          cd core && cargo check --workspace

      - name: Run automated test suite
        run: |
          cd core && cargo test --workspace --verbose

      - name: Build Linux release binaries & UniFFI bindings
        run: |
          cd core
          cargo build --release --workspace
          mkdir -p target/release/bindings
          cargo run --bin uniffi-bindgen generate --library target/release/libsoftify_core.so --language kotlin --out-dir target/release/bindings/kotlin
          ls -lh target/release/softify-cli target/release/libsoftify_core.so

      - name: Upload Linux x86_64 Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: softify-linux-x86_64
          path: |
            core/target/release/softify-cli
            core/target/release/libsoftify_core.so
            core/target/release/bindings/
          if-no-files-found: error

  compose-frontend-and-apk:
    name: Kotlin Compose Multiplatform (Desktop & Android APK)
    runs-on: ubuntu-latest
    needs: rust-check-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download Rust Artifacts
        uses: actions/download-artifact@v4
        with:
          name: softify-linux-x86_64
          path: core/target/release

      - name: Build Desktop and Android APK
        run: |
          chmod +x gradlew
          ./gradlew :app:compileKotlinDesktop :app:assembleRelease --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: softify-v0.1-beta-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
