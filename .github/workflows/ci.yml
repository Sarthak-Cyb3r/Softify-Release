name: Rust Core & Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rust-check-and-test:
    name: Rust Core Compilation & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Check compilation
        run: |
          if [ -d "core" ]; then
            cd core && cargo check --workspace
          else
            echo "Rust core directory not yet created."
          fi

      - name: Run automated test suite
        run: |
          if [ -d "core" ]; then
            cd core && cargo test --workspace --verbose
          else
            echo "Rust core directory not yet created."
          fi
