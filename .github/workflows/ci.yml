name: Rust Core & Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rust-check-and-test:
    name: Rust Core Compilation & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Check compilation
        run: |
          if [ -d "core" ]; then
            cd core && cargo check --workspace
          else
            echo "Rust core directory not yet created."
          fi

      - name: Run automated test suite
        run: |
          if [ -d "core" ]; then
            cd core && cargo test --workspace --verbose
          else
            echo "Rust core directory not yet created."
          fi

      - name: Build Linux release binaries & UniFFI bindings
        run: |
          if [ -d "core" ]; then
            cd core
            cargo build --release --workspace
            if [ -f "target/release/libsoftify_core.so" ]; then
              mkdir -p target/release/bindings
              cargo run --bin uniffi-bindgen generate --library target/release/libsoftify_core.so --language kotlin --out-dir target/release/bindings/kotlin
              echo "Release build and Kotlin bindings generated:"
              ls -lh target/release/softify-cli target/release/libsoftify_core.so
              ls -la target/release/bindings/kotlin/
            fi
          fi

      - name: Upload Linux x86_64 Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: softify-linux-x86_64
          path: |
            core/target/release/softify-cli
            core/target/release/libsoftify_core.so
            core/target/release/bindings/
          if-no-files-found: error
