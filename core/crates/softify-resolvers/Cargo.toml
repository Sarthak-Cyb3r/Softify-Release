[package]
name = "softify-resolvers"
version = "0.1.0"
edition = "2021"
authors = ["Softify Team"]
description = "Music catalog stream resolvers (JioSaavn, Spotify, YouTube Music, lyrics)"

[dependencies]
softify-models = { path = "../softify-models" }
softify-crypto = { path = "../softify-crypto" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "macros", "time"] }
