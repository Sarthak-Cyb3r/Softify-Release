[package]
name = "softify-core"
version = "0.1.0"
edition = "2021"
authors = ["Softify Team"]
description = "Core native engine for Softify Next-Gen music streaming"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Workspace crates
softify-models = { path = "../crates/softify-models" }
softify-crypto = { path = "../crates/softify-crypto" }
softify-storage = { path = "../crates/softify-storage" }
softify-resolvers = { path = "../crates/softify-resolvers" }
softify-recommend = { path = "../crates/softify-recommend" }
softify-analytics = { path = "../crates/softify-analytics" }
softify-updater = { path = "../crates/softify-updater" }

# Cryptography
des = "0.8"
cipher = { version = "0.4", features = ["block-padding"] }
generic-array = "0.14"
base64 = "0.22"

# Serialization & Networking
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
async-trait = "0.1"

# Local Database & Search
rusqlite = { version = "0.32", features = ["bundled"] }

# Utilities
thiserror = "1.0"

# UniFFI for Kotlin / Multiplatform Bindings
uniffi = { version = "0.28", features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
