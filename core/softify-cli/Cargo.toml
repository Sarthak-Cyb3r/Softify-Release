[package]
name = "softify-cli"
version = "0.1.0"
edition = "2021"
authors = ["Softify Team"]
description = "Terminal CLI runner for Softify Next-Gen"

[dependencies]
softify-core = { path = "../softify-core" }
softify-models = { path = "../crates/softify-models" }
softify-crypto = { path = "../crates/softify-crypto" }
softify-storage = { path = "../crates/softify-storage" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
